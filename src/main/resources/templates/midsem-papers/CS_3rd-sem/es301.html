<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=4.0, user-scalable=yes">
    <title>ES-301 Energy & Environmental Engineering | LNCT</title>
    <link th:href="@{/css/bt201.css}" rel="stylesheet">
    <link th:href="@{/css/home.css}" rel="stylesheet">
    <link th:href="@{/css/shared.css}" rel="stylesheet">
    <link th:href="@{/css/glass.css}" rel="stylesheet">
    <style>
        .page-header {
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: #93C5FD;
            margin-bottom: 10px;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
    </style>
    <th:block th:insert="fragments/imageviewer :: imageViewer"></th:block>
</head>

<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container">
        <div class="page-header">
            <h1>CSE Mid-Sem Papers <br> 3rd sem </h1>
            <p>ES-301<br>Energy &amp; Environmental Engineering (EEE)</p>
        </div>
        <div class="tabs">
            <input checked id="tab3" name="tab" type="radio">
            <label for="tab3">All Papers</label>
            <div class="content" id="content3">
                <div class="gallery">
                    <div class="paper-thumbnail">
                        <div class="thumbnail-image">
                            <picture>
                                <source media="(max-width: 768px)" th:srcset="@{/images/thumbnails3/ES301_Nov26.webp}">
                                <img alt="Nov 2026" src="/images/CS_3rd-sem/ES301_Nov26.jpg">
                            </picture>
                            <div class="thumbnail-overlay">
                                <div class="view-icon">👁️</div>
                            </div>
                        </div>
                        <div class="thumbnail-info">
                            <div class="thumbnail-title">November 2026</div>
                            <div class="thumbnail-meta">
                                <span class="meta-badge"
                                    th:onclick="|openModal('@{/images/CS_3rd-sem/ES301_Nov26.jpg}')|">View</span>
                                <a class="meta-badge" download href="/images/CS_3rd-sem/ES301_Nov26.jpg">Download</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
</body>

</html>
