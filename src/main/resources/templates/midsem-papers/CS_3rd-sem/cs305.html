<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=4.0, user-scalable=yes">
    <title>CS-305 Object-Oriented Programming & Methodology | LNCT</title>
    <link th:href="@{/css/bt201.css}" rel="stylesheet">
    <link th:href="@{/css/home.css}" rel="stylesheet">
    <link th:href="@{/css/shared.css}" rel="stylesheet">
    <link th:href="@{/css/glass.css}" rel="stylesheet">
    <th:block th:insert="fragments/imageviewer :: imageViewer"></th:block>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="container">
    <div class="page-header">
        <h1>Mid-Semester Papers</h1>
        <p>CS-305<br>Object-Oriented Programming &amp; Methodology</p>
    </div>
    <div class="tabs">
        <input checked id="tab3" name="tab" type="radio">
        <label for="tab3">All Papers</label>
        <div class="content" id="content3">
            <div class="gallery">
                <div class="paper-thumbnail">
                    <div class="thumbnail-image">
                        <picture>
                            <source media="(max-width: 768px)" th:srcset="@{/images/thumbnails3/CS305_Nov26.webp}">
                            <img alt="Nov 2026"
                                 src="/images/CS_3rd-sem/CS305_Nov26.jpg">
                        </picture>
                        <div class="thumbnail-overlay">
                            <div class="view-icon">👁️</div>
                        </div>
                    </div>
                    <div class="thumbnail-info">
                        <div class="thumbnail-title">November 2026</div>
                        <div class="thumbnail-meta">
                            <span class="meta-badge" th:onclick="|openModal('@{/images/CS_3rd-sem/CS305_Nov26.jpg}')|">View</span>
                            <a class="meta-badge" download href="/images/CS_3rd-sem/CS305_Nov26.jpg">Download</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
