<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>LNCT Unofficial — Student Portal</title>
    <meta name="description"
          content="Unofficial student portal for Lakshmi Narain College of Technology (LNCT) - For the students">

    <!-- Open Graph -->
    <meta property="og:title" content="LNCT Unofficial — Student Portal">
    <meta property="og:description"
          content="Unofficial student portal for Lakshmi Narain College of Technology (LNCT).">
    <meta property="og:type" content="website">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/shared.css}">
</head>

<body>
<div th:replace="~{fragments/loader :: loader}"></div>

<!-- ===== NAVBAR =====
     Requires templates/fragments/header.html to define th:fragment="header" -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- ===== HERO SECTION ===== -->
<main>
    <section class="hero">
        <div class="hero-content">
            <h1>
                <span class="line">LAKSHMI NARAIN</span>
                <span class="line">COLLEGE OF TECHNOLOGY</span>
            </h1>
            <span class="badge">Unofficial</span>
            <p>for the Students, of the Students,<br>by the Students</p>
        </div>

        <aside class="profile-card" aria-label="Developer info">
            <div class="profile-header">
                <div class="avatar">
                    <img th:src="@{/images/Developer.png}"
                         alt="Portrait of the student developer"
                         width="120" height="120"/>
                </div>
            </div>
            <p>Created By A First Year Student</p>
        </aside>
    </section>
</main>

</body>

</html>
