<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loader</title>
</head>
<body>
<!-- Loading screen -->
<div th:fragment="loader"  id="page-loader">
    <div class="loader"></div>
</div>
    <script>
        window.addEventListener("load", () => {
            const loader = document.getElementById("page-loader");

            if (loader) {
                loader.classList.add("hide");
            }
        });
    </script>
</div>
</body>
</html>
<style>
    #page-loader {
        position: fixed;
        inset: 0;
        background: white;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
    }

    .loader {
        width: 40px;
        height: 40px;
        border: 4px solid #ddd;
        border-top-color: #333;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    #page-loader.hide {
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease;
    }
</style>
